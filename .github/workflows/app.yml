name: Build app

on:
  workflow_call:
    inputs:
      app:
        type: string
        required: true
      sha:
        type: string
        required: true

permissions: {}

jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.sha }}
          persist-credentials: false

      - uses: actions/setup-java@v6
        with:
          distribution: zulu
          java-version: "21"

      - name: Install xdotool
        run: sudo apt-get update -qq && sudo apt-get install -y -qq xdotool

      - name: Patch
        env:
          GH_TOKEN: ${{ github.token }}
          APP: ${{ inputs.app }}
        run: ./build.sh "$APP"

      - uses: actions/upload-artifact@v7
        with:
          name: unsigned-${{ inputs.app }}
          path: build/${{ inputs.app }}/
          if-no-files-found: error
          retention-days: 3

  release:
    needs: patch
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.sha }}
          persist-credentials: false

      - uses: actions/setup-java@v6
        with:
          distribution: zulu
          java-version: "21"

      - uses: actions/download-artifact@v8
        with:
          name: unsigned-${{ inputs.app }}
          path: unsigned

      - name: Read build info
        id: meta
        env:
          APP: ${{ inputs.app }}
        run: |
          set -euo pipefail
          source common.sh
          info=unsigned/build-info.json
          version=$(jq -r .version "$info")
          patches=$(jq -r .patches_tag "$info")
          stock_sha256=$(jq -r .stock_sha256 "$info")
          stock_signer=$(jq -r .stock_signer "$info")
          stock_source=$(jq -r .stock_source "$info")
          patches_repo=$(app_cfg "$APP" patches-repo)
          arch=$(app_cfg "$APP" arch arm64-v8a)
          build_mode=$(app_cfg "$APP" build-mode apk)
          [[ $version =~ ^[0-9][0-9A-Za-z._-]*$ ]]
          [[ $patches =~ ^v[0-9]+(\.[0-9]+)+(-[a-z]+\.[0-9]+)?$ ]]
          [[ $stock_sha256 =~ ^[0-9a-f]{64}$ ]]
          [[ $stock_signer =~ ^[0-9a-f]{64}$ ]]
          [[ $stock_source =~ ^(archive\.org|apkmirror|cache)$ ]]
          [[ $arch =~ ^(arm64-v8a|arm-v7a|x86|x86_64|all)$ ]]
          [[ $build_mode =~ ^(apk|module|both)$ ]]
          name=${APP,,}
          {
            echo "version=$version"
            echo "patches=$patches"
            echo "patches_repo=$patches_repo"
            echo "stock_sha256=$stock_sha256"
            echo "stock_signer=$stock_signer"
            echo "stock_source=$stock_source"
            echo "build_mode=$build_mode"
            echo "apk=$name-$version-$arch.apk"
            echo "zip=$name-module-$version-$arch.zip"
            echo "tag=$name-$version-patches-$patches"
          } >>"$GITHUB_OUTPUT"

      - name: Sign
        id: sign
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          BUILD_MODE: ${{ steps.meta.outputs.build_mode }}
          APK: ${{ steps.meta.outputs.apk }}
        run: |
          set -euo pipefail
          export KEYSTORE="$RUNNER_TEMP/release.keystore"
          (umask 077 && base64 -d <<<"$KEYSTORE_B64" >"$KEYSTORE")
          mkdir release work
          signed=()
          if [ "$BUILD_MODE" != module ]; then ./sign.sh unsigned/apk-unsigned.apk "release/$APK" && signed+=("release/$APK"); fi
          if [ "$BUILD_MODE" != apk ]; then ./sign.sh unsigned/module-unsigned.apk work/module.apk && signed+=(work/module.apk); fi
          rm -f "$KEYSTORE"
          signer=$(java -jar bin/apksigner.jar verify --print-certs "${signed[0]}" | grep '^Signer #1 certificate SHA-256' | awk '{print $NF}')
          echo "signer=$signer" >>"$GITHUB_OUTPUT"

      - name: Build module
        if: steps.meta.outputs.build_mode != 'apk'
        env:
          APP: ${{ inputs.app }}
          VERSION: ${{ steps.meta.outputs.version }}
          PATCHES: ${{ steps.meta.outputs.patches }}
          ZIP: ${{ steps.meta.outputs.zip }}
          TAG: ${{ steps.meta.outputs.tag }}
        run: |
          set -euo pipefail
          base="https://github.com/$GITHUB_REPOSITORY/releases"
          ANDROID_NDK="$ANDROID_NDK_LATEST_HOME" UPDATE_JSON="$base/latest/download/update.json" \
            ./module.sh "$APP" work/module.apk unsigned/stock.apk "$VERSION" "$PATCHES" "$GITHUB_RUN_NUMBER" "release/$ZIP"
          jq -n \
            --arg version "v$VERSION (patches $PATCHES)" \
            --argjson versionCode "$GITHUB_RUN_NUMBER" \
            --arg zipUrl "$base/download/$TAG/$ZIP" \
            --arg changelog "$base/download/$TAG/changelog.md" \
            '$ARGS.named' >release/update.json

      - name: Write notes
        env:
          GH_REPO: ${{ github.repository }}
          APP: ${{ inputs.app }}
          VERSION: ${{ steps.meta.outputs.version }}
          PATCHES: ${{ steps.meta.outputs.patches }}
          PATCHES_REPO: ${{ steps.meta.outputs.patches_repo }}
          STOCK_SHA256: ${{ steps.meta.outputs.stock_sha256 }}
          STOCK_SIGNER: ${{ steps.meta.outputs.stock_signer }}
          STOCK_SOURCE: ${{ steps.meta.outputs.stock_source }}
          BUILD_MODE: ${{ steps.meta.outputs.build_mode }}
          SIGNER: ${{ steps.sign.outputs.signer }}
        run: |
          set -euo pipefail
          for f in unsigned/patch-result-*.json; do jq . "$f" >"release/${f#unsigned/}"; done
          {
            echo "$APP $VERSION patched with [$PATCHES_REPO $PATCHES](https://github.com/$PATCHES_REPO/releases/tag/$PATCHES)"
            echo
            echo "| | SHA-256 |"
            echo "|---|---|"
            for f in release/*; do echo "| \`${f#release/}\` | \`$(sha256sum "$f" | cut -d' ' -f1)\` |"; done
            echo "| APK signing certificate | \`$SIGNER\` |"
            echo "| Stock ($STOCK_SOURCE) | \`$STOCK_SHA256\` |"
            echo "| Stock signing certificate | \`$STOCK_SIGNER\` |"
            echo
            echo "Verify: \`gh attestation verify <file> --repo $GH_REPO\`"
          } >notes.md
          if [ "$BUILD_MODE" != apk ]; then cp notes.md release/changelog.md; fi

      - uses: actions/attest-build-provenance@v4
        with:
          subject-path: release/*

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          APP: ${{ inputs.app }}
          VERSION: ${{ steps.meta.outputs.version }}
          PATCHES: ${{ steps.meta.outputs.patches }}
          BUILD_MODE: ${{ steps.meta.outputs.build_mode }}
          TAG: ${{ steps.meta.outputs.tag }}
          TARGET: ${{ inputs.sha }}
        run: |
          set -euo pipefail
          title="$APP $VERSION (patches $PATCHES) $(TZ=Asia/Seoul date +%F)"
          latest=false
          if [ "$BUILD_MODE" != apk ]; then latest=true; fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" release/* --clobber
            gh release edit "$TAG" --title "$title" --notes-file notes.md --latest="$latest"
          else
            gh release create "$TAG" release/* --title "$title" --notes-file notes.md --target "$TARGET" --latest="$latest"
          fi
