name: Build

on:
  schedule:
    - cron: "0 16 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: Build every app even if a release for its newest patches already exists
        type: boolean
        default: false

permissions: {}

concurrency:
  group: build
  cancel-in-progress: false

jobs:
  bump-cli:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      sha: ${{ steps.bump.outputs.sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - id: bump
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag=$(./bump-cli.sh config.toml)
          sha=$GITHUB_SHA
          if ! git diff --quiet config.toml; then
            sha=$(gh api -X PUT "repos/$GITHUB_REPOSITORY/contents/config.toml" \
              -f message="Bump CLI to $tag" \
              -f content="$(base64 -w0 config.toml)" \
              -f sha="$(git rev-parse HEAD:config.toml)" \
              -f branch="$GITHUB_REF_NAME" \
              --jq .commit.sha)
          fi
          echo "sha=$sha" >>"$GITHUB_OUTPUT"

  check:
    needs: bump-cli
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      apps: ${{ steps.check.outputs.apps }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.bump-cli.outputs.sha }}
          persist-credentials: false

      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
          FORCE: ${{ inputs.force || 'false' }}
        run: |
          set -euo pipefail
          releases=$(gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100")
          apps=()
          for app in $(./build.sh --apps); do
            tag=$(./build.sh "$app" --patches-tag)
            if [ "$FORCE" != true ] && jq -e --arg p "${app,,}-" --arg s "-patches-$tag" \
              'any(.[]; .tag_name | startswith($p) and endswith($s))' <<<"$releases" >/dev/null; then
              echo "$app: patches $tag already built"
            else
              apps+=("$app")
            fi
          done
          echo "apps=$(jq -cn '$ARGS.positional' --args "${apps[@]}")" >>"$GITHUB_OUTPUT"

  build:
    needs: [bump-cli, check]
    if: needs.check.outputs.apps != '[]'
    strategy:
      fail-fast: false
      matrix:
        app: ${{ fromJSON(needs.check.outputs.apps) }}
    permissions:
      contents: write
      id-token: write
      attestations: write
    uses: ./.github/workflows/app.yml
    with:
      app: ${{ matrix.app }}
      sha: ${{ needs.bump-cli.outputs.sha }}
